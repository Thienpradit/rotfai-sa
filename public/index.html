<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="รถไฟซ่า">
<meta name="theme-color" content="#0d1020">
<title>รถไฟซ่า.io</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1020;font-family:'Mitr',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,25,.55);z-index:10}
.hidden{display:none!important}
.panel{background:#1a1f3d;border-radius:22px;padding:18px 18px;width:min(380px,90vw);max-height:92vh;overflow-y:auto;touch-action:pan-y;box-sizing:border-box;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);border:2px solid #2f3870}
h1{margin:0 0 2px;font-size:40px;line-height:1.15;background:linear-gradient(90deg,#ffd23f,#ff6b9a,#77ccff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 10px;font-size:28px}
.sub{color:#aab3e6;font-size:14px;margin-bottom:12px}
input{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;border:2px solid #3a4590;background:#0f1330;color:#fff;font:inherit;font-size:16px;text-align:center;outline:none;user-select:text;-webkit-user-select:text}
input:focus{border-color:#77ccff}
.skins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.skin{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-sizing:border-box;position:relative}
.skin.sel{border-color:#fff;transform:scale(1.15)}
.skin.lock{opacity:.45}
.skin.lock::after{content:'🔒';position:absolute;right:-6px;bottom:-6px;font-size:12px}
.diffs{display:flex;gap:6px;margin:4px 0 4px}
.dbtn{flex:1;padding:8px 4px;border-radius:12px;background:#0f1330;border:2px solid #3a4590;cursor:pointer;font-size:15px;font-weight:600;color:#aab3e6}
.dbtn.on[data-d=easy]{border-color:#7cfc9a;color:#7cfc9a;background:rgba(124,252,154,.12)}
.dbtn.on[data-d=normal]{border-color:#ffd23f;color:#ffd23f;background:rgba(255,210,63,.12)}
.dbtn.on[data-d=hard]{border-color:#ff5e5e;color:#ff5e5e;background:rgba(255,94,94,.12)}
.dnote{font-size:12px;color:#8891c4;min-height:16px;margin-bottom:2px}
.btn{display:block;width:100%;padding:12px;margin-top:9px;border:0;border-radius:14px;font:inherit;font-size:17px;font-weight:600;cursor:pointer;color:#1a1f3d;background:#ffd23f;box-shadow:0 4px 0 #b8901a}
.btn.alt{background:#77ccff;box-shadow:0 4px 0 #3a86b8}
.btn.team{background:linear-gradient(90deg,#ff6b6b,#4da3ff);color:#fff;box-shadow:0 4px 0 #3a3f80}
#coopBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:6px}
#coopBar button{border:2px solid #3a4590;background:rgba(15,19,48,.85);color:#fff;font:inherit;font-size:13px;border-radius:12px;padding:6px 10px;cursor:pointer}
.btn.gray{background:#3a4470;color:#cfd6ff;box-shadow:0 4px 0 #262d52}
.btn:disabled{opacity:.45}
.btn:active{transform:translateY(3px);box-shadow:none}
.row4{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.mbtn{background:#0f1330;border:2px solid #3a4590;border-radius:12px;color:#fff;font:inherit;font-size:12px;padding:7px 2px;cursor:pointer;position:relative;line-height:1.35}
.mbtn .dot{position:absolute;top:4px;right:6px;width:9px;height:9px;border-radius:50%;background:#ff5e5e}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.coin{background:#0f1330;border-radius:12px;padding:4px 10px;font-weight:600;color:#ffd23f}
.ibtn{background:#0f1330;border:2px solid #3a4590;border-radius:12px;color:#fff;font-size:18px;width:40px;height:36px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.stat{background:#0f1330;border-radius:12px;padding:9px}
.stat b{display:block;font-size:23px;color:#ffd23f}
.stat span{font-size:12px;color:#aab3e6}
.help{font-size:12px;color:#8891c4;margin-top:10px;line-height:1.55}
.codebox{display:flex;gap:6px;margin-top:8px}
.codebox input{font-size:12px;padding:8px}
.codebox button,.sbtn{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;background:#77ccff;color:#1a1f3d;cursor:pointer;white-space:nowrap}
.sbtn:disabled{background:#3a4470;color:#7c86b5}
#coinEarn{color:#ffd23f;font-weight:600;margin-top:6px}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheetHead h3{margin:0;font-size:20px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:7px;border-radius:10px;background:#0f1330;cursor:pointer;color:#9aa6d8;font-size:14px}
.tab.on{background:#2f3870;color:#ffd23f;font-weight:600}
.item{display:flex;align-items:center;gap:10px;background:#0f1330;border-radius:12px;padding:9px;margin-bottom:7px;text-align:left}
.item .ic{font-size:26px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}
.item .tx{flex:1;min-width:0;font-size:14px}
.item .tx small{display:block;color:#9aa6d8;font-size:12px}
.bar{height:7px;border-radius:4px;background:#2a3060;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#7cfc9a}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ach div{background:#0f1330;border-radius:12px;padding:8px 4px;font-size:11px;color:#9aa6d8}
.ach div b{display:block;font-size:26px;filter:grayscale(1);opacity:.4}
.ach div.on{color:#fff;border:2px solid #ffd23f}
.ach div.on b{filter:none;opacity:1}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tcol{border-radius:12px;padding:8px;min-height:90px;font-size:14px}
.tcol.A{background:rgba(255,94,94,.15);border:2px solid #ff5e5e}
.tcol.B{background:rgba(77,163,255,.15);border:2px solid #4da3ff}
.tcol div{padding:3px 0}
.tpick{display:block;width:100%;margin-top:8px;padding:8px 4px;border-radius:10px;border:0;font:inherit;font-size:14px;font-weight:600;color:#fff;cursor:pointer}
.tcol.A .tpick{background:#ff5e5e}.tcol.B .tpick{background:#4da3ff}
.tcol div.tpick{background:rgba(255,255,255,.12);color:#fff;text-align:center}.tcol div.tpick.off{color:#8891c4}
.status{font-size:13px;color:#ffb35e;margin-top:8px;min-height:18px}
#boost{position:fixed;right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(255,210,63,.28);color:#fff;font:inherit;font-size:15px;font-weight:600;z-index:5;touch-action:none}
#boost.on{background:rgba(255,210,63,.7)}
#boost small,#bomb small{font-size:12px;font-weight:400}
#bomb.warn{border-color:#ff5e5e;background:rgba(255,60,60,.65)}
#bomb{position:fixed;right:calc(30px + env(safe-area-inset-right));bottom:calc(126px + env(safe-area-inset-bottom));width:72px;height:72px;border-radius:50%;border:3px solid #ffd23f;background:rgba(255,120,40,.55);color:#fff;font:inherit;font-size:24px;line-height:1.1;font-weight:600;z-index:5;touch-action:none;cursor:pointer;animation:pulse 1s infinite}
#snd{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;opacity:.8}
#fsGame{position:fixed;left:calc(60px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;opacity:.8}
.fsb{font-size:17px}
@keyframes pulse{50%{transform:scale(1.08)}}
#ann{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:8;background:rgba(15,19,48,.9);border:2px solid #ffd23f;padding:10px 16px;border-radius:14px;font-size:16px;text-align:center;max-width:84vw;pointer-events:none;opacity:0;transition:opacity .3s}
#ann.show{opacity:1}
#sheet{z-index:20}
.acct{background:#0f1330;border:2px solid #3a4590;border-radius:12px;color:#fff;font:inherit;font-size:13px;padding:5px 10px;cursor:pointer;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct.on{border-color:#7cfc9a;color:#7cfc9a}
.gnote{font-size:12px;color:#ffb35e;margin-top:6px;line-height:1.5}.gnote u{cursor:pointer;color:#77ccff}
input.locked{opacity:.75;border-color:#7cfc9a}
.lb{max-height:340px;overflow-y:auto;text-align:left;margin-top:6px}
.lb div{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px}
.lb div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb div span:last-child{white-space:nowrap;color:#cfd6ff}
.lb .pos{display:inline-block;width:26px;font-weight:600}.lb .pos i{font-style:normal;color:#8891c4}.lb .top3{font-size:14px;font-weight:600}
.lb small{color:#9aa6d8;font-size:11px}.lb div.gap{justify-content:center;color:#5a6080;padding:0}.lb div.lbnote{display:block;text-align:center;color:#8891c4;font-size:12px;background:none!important}.lb div:nth-child(odd){background:#0f1330}.lb div.me{color:#ffd23f}
.rankbox{background:#0f1330;border-radius:12px;padding:8px 12px;margin:8px 0 2px;text-align:left;cursor:pointer}
.rankbox .rk1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.rankbox b{font-size:16px}.rankbox span{font-size:12px;color:#aab3e6;white-space:nowrap}.rankbox i{font-style:normal}
.rankbox small{display:block;font-size:11px;color:#8891c4;margin-top:3px}
.rkmore{float:right;color:#77ccff;font-weight:600}
#sheetBody .rkmore{display:none}
@media (max-width:380px){#menu .row4.four{gap:4px}#menu .row4.four .mbtn{font-size:10.5px;letter-spacing:-.3px}}
@media (max-width:340px){#menu .row4.four .mbtn{font-size:9px}}#sheetBody .rankbox{cursor:default}
/* หน้าแรก: จัดกลุ่มให้อ่านง่าย */
.card{background:#151a36;border:1px solid #2a3264;border-radius:16px;padding:12px 12px 6px;margin-top:4px}
.card .gnote{margin:8px 0 0}
.lbl{font-size:12px;color:#8891c4;text-align:left;margin:10px 2px 0;font-weight:600;letter-spacing:.3px}
.card .skins{margin:6px -4px 4px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:5px 6px;touch-action:pan-x;scrollbar-width:none}
.card .skins::-webkit-scrollbar{display:none}.card .skin{flex:0 0 32px}
#rankMenu .rankbox{margin-top:12px}
@media (max-height:720px){#menu h1{font-size:32px}#menu .sub{margin-bottom:8px}.btn.play{padding:8px 10px 7px}.btn.play .bt{font-size:16px}}
.btn.play{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px 9px;margin-top:8px}
.btn.play .bt{font-size:17px;line-height:1.25}
.btn.play small{font-size:11.5px;font-weight:400;opacity:.82;line-height:1.3}
.btn.team.play small{opacity:.92}
.row4.four{grid-template-columns:repeat(5,1fr);gap:5px;margin-top:14px}
.row4.four .mbtn{padding:8px 1px 7px;font-size:11px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden}
.row4.four .mbtn b{display:block;font-size:20px;line-height:1.2;font-weight:400}
.best{font-size:12.5px;color:#ffd23f;margin-top:10px;min-height:0}
.best:empty{display:none}
#menu .help{margin-top:6px;font-size:11.5px}
.hlist{text-align:left;font-size:13.5px;line-height:1.6;margin:0;padding:0;list-style:none}
.hlist li{background:#0f1330;border-radius:10px;padding:7px 10px;margin-bottom:6px}
.hlist li b{color:#ffd23f}
.tabs.wrap{flex-wrap:wrap;gap:5px}.tabs.wrap .tab{flex:1 0 21%;font-size:12px;padding:6px 2px}
.item.deal{border:2px solid #ffd23f}.item .old{text-decoration:line-through;color:#8891c4;margin-right:4px}
.tag{display:inline-block;font-size:10px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:4px;background:#ff5e5e;color:#fff;vertical-align:1px}
.rcode{font-size:24px;font-weight:600;letter-spacing:3px;color:#ffd23f;background:#0f1330;border-radius:12px;padding:10px;margin:8px 0;user-select:text;-webkit-user-select:text}
.link{color:#77ccff;cursor:pointer;text-decoration:underline;font-size:13px}
#horn{position:fixed;right:calc(122px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(119,204,255,.3);color:#fff;font-size:24px;z-index:5;touch-action:none;cursor:pointer}
#horn.cd{opacity:.4}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="overlay">
  <div class="panel">
    <div class="topbar"><span class="coin" id="coinTop">🪙 0</span><button class="acct" id="acctBtn">👻 Guest</button><span><button class="ibtn fsb" id="fsMenu" title="เต็มจอ">⛶</button> <button class="ibtn" id="sndMenu">🔊</button></span></div>
    <h1>รถไฟซ่า.io</h1>
    <div class="sub">เก็บพลอยต่อขบวนให้ยาว ตัดหน้าคู่แข่งให้ชน!</div>
    <div class="card">
      <input id="name" maxlength="14" placeholder="ตั้งชื่อรถไฟของคุณ">
      <div class="gnote hidden" id="guestNote">👻 เล่นแบบ Guest — เหรียญ แรงก์ และของในร้าน<b>จะไม่ถูกบันทึก</b> · <u id="guestReg">ลงทะเบียน</u></div>
      <div class="lbl">🎨 สีรถไฟ <span style="font-weight:400">(เลื่อนดูได้ ›)</span></div>
      <div class="skins" id="skins"></div>
    </div>
    <div class="lbl" style="margin-top:12px">เลือกโหมด</div>
    <button class="btn play" id="playInf"><span class="bt">🌍 เล่นออนไลน์</span><small>เจอผู้เล่นจริง · สูงสุด 30 ขบวน (คนไม่ครบเติมบอท)</small></button>
    <button class="btn alt play" id="playBot"><span class="bt">🤖 เล่นกับบอท</span><small>เล่นคนเดียว · เลือกความยาก Easy / Normal / Hard</small></button>
    <button class="btn team play" id="playOnline"><span class="bt">🌐 2v2 กับเพื่อน</span><small>สร้างห้องแข่งทีม · คนไม่ครบเติมบอทให้</small></button>
    <div id="rankMenu"></div>
    <div class="row4 four">
      <button class="mbtn" id="bRank"><b>🏆</b>แรงก์</button>
      <button class="mbtn" id="bShop"><b>🛒</b>ร้านค้า</button>
      <button class="mbtn" id="bMis"><b>📋</b>ภารกิจ<span class="dot hidden" id="misDot"></span></button>
      <button class="mbtn" id="bAch"><b>🏅</b>เหรียญตรา</button>
      <button class="mbtn" id="bHelp"><b>❓</b>วิธีเล่น</button>
    </div>
    <div class="best" id="best"></div>
    <div class="help" id="help"></div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <h2 id="overTitle">จบเกม!</h2>
    <div class="stats">
      <div class="stat"><b id="sLen">0</b><span>ความยาว</span></div>
      <div class="stat"><b id="sKill">0</b><span>กำจัดได้</span></div>
      <div class="stat"><b id="sRank">-</b><span>อันดับ</span></div>
      <div class="stat"><b id="sBest">0</b><span>สถิติดีสุด (<span id="sDiff"></span>)</span></div>
    </div>
    <div id="coinEarn"></div>
    <div id="rankOver"></div>
    <div class="gnote hidden" id="guestOver">👻 Guest: รอบนี้จะไม่ถูกบันทึก · <u id="guestReg2">ลงทะเบียนตอนนี้ เก็บเหรียญ/แรงก์รอบนี้ไว้ได้</u></div>
    <button class="btn" id="again">เล่นอีกครั้ง</button>
    <button class="btn alt" id="toMenu">กลับหน้าแรก</button>
  </div>
</div>

<div id="sheet" class="overlay hidden">
  <div class="panel">
    <div class="sheetHead"><h3 id="sheetTitle"></h3><button class="ibtn" id="sheetClose">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<button id="boost" class="hidden">เร่ง!</button>
<button id="bomb" class="hidden">💣</button>
<button id="horn" class="hidden" title="หวูด (H)">📯</button>
<button id="snd" class="ibtn hidden">🔊</button>
<button id="fsGame" class="ibtn fsb hidden" title="เต็มจอ">⛶</button>
<div id="coopBar" class="hidden"><button id="coopInv">📤 ชวนเพื่อน</button><button id="coopExit">🚪 ออก</button></div>
<div id="ann"></div>
<div id="safeProbe" style="position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>

<script>
// =====================================================================
//  basics
// =====================================================================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
{const A=CanvasRenderingContext2D.prototype.arc;ctx.arc=function(x,y,r,a,b,c){A.call(this,x,y,r>0?r:0,a,b,c)}}
let VW,VH,DPR;
const SAFE={t:0,r:0,b:0,l:0};
function readSafe(){const e=document.getElementById('safeProbe');if(!e)return;const c=getComputedStyle(e);SAFE.t=parseFloat(c.paddingTop)||0;SAFE.r=parseFloat(c.paddingRight)||0;SAFE.b=parseFloat(c.paddingBottom)||0;SAFE.l=parseFloat(c.paddingLeft)||0}
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);const vv=window.visualViewport;VW=Math.round(Math.max(innerWidth,vv?vv.width:0));VH=Math.round(Math.max(innerHeight,vv?vv.height:0));cv.width=VW*DPR;cv.height=VH*DPR;readSafe()}
addEventListener('resize',resize);resize();
// หมุนจอ (ตั้ง↔นอน): มือถือบางรุ่นบอกขนาดจอใหม่ช้า เลยวัดซ้ำหลายครั้ง
addEventListener('orientationchange',()=>{for(const t of[50,250,600,1000])setTimeout(resize,t)});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(resize,30));
const $=id=>document.getElementById(id);
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const SELF_IDX=20,FOOD_N=1700,PU_N=18,CS=100,TAU=Math.PI*2;
let WR=3000,AR=3000;
const rnd=(a,b)=>a+Math.random()*(b-a);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let rails=[],stations=[],portals=[];
function buildWorld(R){
  rails=[];stations=[];portals=[];
  const lr=R*.6,N=72;
  for(let i=0;i<N;i++){const a=i/N*TAU,b=(i+1)/N*TAU;rails.push(mkSeg(Math.cos(a)*lr,Math.sin(a)*lr,Math.cos(b)*lr,Math.sin(b)*lr))}
  for(let k=0;k<3;k++){const a=k*TAU/3+.4,b=a+2.3;rails.push(mkSeg(Math.cos(a)*R*.86,Math.sin(a)*R*.86,Math.cos(b)*R*.86,Math.sin(b)*R*.86))}
  for(let k=0;k<4;k++){const a=k*TAU/4+.35;stations.push({x:Math.cos(a)*lr,y:Math.sin(a)*lr,a:a+Math.PI/2,ox:Math.cos(a),oy:Math.sin(a),cd:0})}
  const PC=['#ff6b9a','#7cfc9a','#ffb35e'];
  for(let k=0;k<3;k++){const a=k*TAU/3+1.05;portals.push({x:Math.cos(a)*R*.33,y:Math.sin(a)*R*.33,pair:k*2+1,col:PC[k]});portals.push({x:Math.cos(a+Math.PI*.85)*R*.82,y:Math.sin(a+Math.PI*.85)*R*.82,pair:k*2,col:PC[k]})}
}
function mkSeg(ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy);return{ax,ay,bx,by,ux:dx/l,uy:dy/l,l,x0:Math.min(ax,bx)-30,x1:Math.max(ax,bx)+30,y0:Math.min(ay,by)-30,y1:Math.max(ay,by)+30}}
function onRail(h,ang){
  const ca=Math.cos(ang),sa=Math.sin(ang);
  for(const s of rails){if(h.x<s.x0||h.x>s.x1||h.y<s.y0||h.y>s.y1)continue;
    const t=(h.x-s.ax)*s.ux+(h.y-s.ay)*s.uy;if(t<0||t>s.l)continue;const px=s.ax+s.ux*t,py=s.ay+s.uy*t;
    if((h.x-px)**2+(h.y-py)**2<26*26&&Math.abs(ca*s.ux+sa*s.uy)>.75)return true}
  return false;
}
const TUNNEL_SAFE=2,PORTAL_EDGE=260;
// อุโมงค์ที่ปลายทางอยู่ใกล้/นอกวงสนาม (วงหดแล้ว) = ปิด ไม่วาร์ป ไม่งั้นออกไปโผล่ในพื้นที่แดงแล้วตาย
const portalOpen=p=>{const q=portals[p.pair];return Math.hypot(q.x,q.y)<AR-PORTAL_EDGE&&Math.hypot(p.x,p.y)<AR-60};
function checkTunnel(w){
  const h=w.pts[0];
  for(const p of portals){if((h.x-p.x)**2+(h.y-p.y)**2<38*38){
    if(!portalOpen(p)){if(w.isP&&!w.closedMsg){w.closedMsg=1;texts.push({x:p.x,y:p.y-50,txt:'🚫 อุโมงค์ปิด (ปลายทางอยู่นอกวง)',t:1.4,c:'#ff9b9b'});setTimeout(()=>w.closedMsg=0,1500)}return}
    const q=portals[p.pair],dx=q.x+Math.cos(w.angle)*75-h.x,dy=q.y+Math.sin(w.angle)*75-h.y;
    for(const pt of w.pts){pt.x+=dx;pt.y+=dy}w.tunCD=1.5;w.safe=Math.max(w.safe,TUNNEL_SAFE);   // ออกจากอุโมงค์แล้วอมตะ 2 วิ
    if(w.isP){sfx('tunnel');track('tunnels');texts.push({x:q.x,y:q.y-50,txt:'🚇 ลอดอุโมงค์! 🛡️ อมตะ 2 วิ',t:1.6,c:p.col})}
    return}}
}

class Worm{
  constructor(name,skin,x,y,isP,o={}){
    this.name=name;this.skin=skin;this.isP=isP;this.mass=isP?20:rnd(12,70);this.loco=o.loco||'classic';this.smokeT=o.smoke||'normal';this.wag=o.wag||'gem';this.kfx=o.kfx||'none';this.title=o.title||'';
    this.angle=o.a??Math.random()*TAU;this.target=this.angle;this.boost=false;this.alive=true;this.kills=0;
    this.pu={magnet:0,x3:0,speed:0};this.ai={t:0,tx:x,ty:y,boostT:0};this.safe=isP?D().safe:1;this.maxMass=this.mass;
    this.seed=(Math.random()*8)|0;this.ghost=0;this.energy=5;this.tgs=0;this.bombT=[];this.selfCD=0;this.tunCD=0;this.slow=0;this.gold=false;
    this.pts=[];const n=this.nPts(),s=this.r()*.42;
    for(let i=0;i<n;i++)this.pts.push({x:x-Math.cos(this.angle)*i*s,y:y-Math.sin(this.angle)*i*s});
  }
  r(){return Math.min(10+Math.sqrt(this.mass)*.75,44)}
  nPts(){return Math.min(Math.floor(14+this.mass*.45),700)}
  follow(){
    const n=this.nPts();
    while(this.pts.length<n){const t=this.pts[this.pts.length-1];this.pts.push({x:t.x,y:t.y})}
    if(this.pts.length>n)this.pts.length=n;
    const s=this.r()*.42;
    for(let i=1;i<this.pts.length;i++){const a=this.pts[i-1],b=this.pts[i];const dx=a.x-b.x,dy=a.y-b.y,dd=Math.hypot(dx,dy);if(dd>s){const k=(dd-s)/dd;b.x+=dx*k;b.y+=dy*k}}
  }
  update(f,dt){
    const r=this.r();
    let d=this.target-this.angle;d=Math.atan2(Math.sin(d),Math.cos(d));
    const tr=.12/(1+r/30)*f;this.angle+=Math.max(-tr,Math.min(tr,d));
    let sp=2.7;if(this.pu.speed>0)sp*=1.4;
    this.onRail=onRail(this.pts[0],this.angle);if(this.onRail)sp*=1.6;
    if(this.slow>0){this.slow-=dt;sp*=.45}
    const boosting=this.boost&&this.energy>0;
    if(boosting){sp*=2;this.energy=Math.max(0,this.energy-dt);if(this.isP)sfx('whistle')}
    const h=this.pts[0];h.x+=Math.cos(this.angle)*sp*f;h.y+=Math.sin(this.angle)*sp*f;
    this.follow();
    for(const k in this.pu)if(this.pu[k]>0)this.pu[k]-=dt;
    if(this.safe>0)this.safe-=dt;if(this.ghost>0)this.ghost-=dt;if(this.selfCD>0)this.selfCD-=dt;
    if(this.tunCD>0)this.tunCD-=dt;else checkTunnel(this);
    if(this.mass>this.maxMass)this.maxMass=this.mass;
    if(this.isBoss&&this.energy<MAX_EN)this.energy+=dt*.5;
    if(h.x*h.x+h.y*h.y>(AR-r*.5)**2)this.die(null);
  }
  die(killer){
    if(!this.alive)return;this.alive=false;
    if(this.isRemote)return;
    const m=this.mass*.8,cnt=Math.max(6,Math.min(160,Math.floor(this.pts.length/2))),v=m/cnt,drop=[];
    for(let i=0;i<cnt;i++){const q=this.pts[Math.floor(i/cnt*this.pts.length)];drop.push([Math.round(q.x+rnd(-10,10)),Math.round(q.y+rnd(-10,10))])}
    if(NET&&this.isP)netSend({t:'die',k:killer&&killer.netId||null,drop,v});else if(NET&&this.isBot)netSend({t:'bdie',id:this.netId,k:killer&&killer.netId||null,drop,v});else if(!NET)for(const[x,y]of drop)addFood(x,y,v,DROP_TTL);
    {const kf=killer&&(killer.isP?prof.eq.kfx:killer.kfx);if(kf&&kf!=='none'){const q=this.pts[0];killFx(q.x,q.y,kf)}}
    if(killer&&(!NET||this.isBot&&killer.isP)){killer.kills++;if(killer.isP){const h=killer.pts[0];texts.push({x:h.x,y:h.y-30,txt:'กำจัด '+this.name+'!',t:1.6,c:'#ffd23f'});sfx('kill');track('kills');if(bombing)bombHits++}}
    if(this.isBoss){bossActive=null;bossTimer=150;if(killer&&killer.isP){addCoins(BOSS_COINS,'👑 ล้มบอสยักษ์!');track('boss')}announce(killer&&killer.isP?'👑 คุณล้มบอสรถไฟยักษ์ได้!':'👑 บอสรถไฟยักษ์ถูกทำลายแล้ว')}
    if(this.isP){sfx('die');bb.classList.add('hidden');$('bomb').classList.add('hidden');$('horn').classList.add('hidden');
      if(NET&&!NET.ffa){NET.respawnT=3}else{state='dead';deadT=1.3}}
  }
}
function cutSelf(w,idx,byGold){
  const p=w.pts;if(idx>=p.length)return;const removed=p.slice(idx),old=w.mass;
  w.mass=Math.max(10,(idx-14)/.45);p.length=Math.min(p.length,w.nPts());
  let lost=Math.max(0,old-w.mass);const cnt0=Math.max(3,Math.min(80,Math.floor(removed.length/3))),drop=[];const cnt=lost>0?cnt0:0;
  for(let i=0;i<cnt;i++){const q=removed[Math.floor(i/cnt*removed.length)];drop.push([Math.round(q.x+rnd(-8,8)),Math.round(q.y+rnd(-8,8))])}
  if(NET){if(w.isP||w.isBot)netSend({t:'drop',drop,v:lost*.5/cnt})}else for(const[x,y]of drop)addFood(x,y,lost*.5/cnt);
  w.selfCD=.8;
  if(w.isP){sfx('cut');if(!byGold){const h=p[0];texts.push({x:h.x,y:h.y-30,txt:'ขบวนขาด! -'+Math.floor(lost),t:1.6,c:'#ff5e5e'})}}
}

let bgrid=new Map(),fgrid=new Map();
function buildFoodGrid(){fgrid.clear();for(const fd of foods){const k=key(Math.floor(fd.x/CS),Math.floor(fd.y/CS));let a=fgrid.get(k);if(!a)fgrid.set(k,a=[]);a.push(fd)}}
function buildBodyGrid(){bgrid.clear();for(const w of worms){if(!w.alive)continue;const p=w.pts;for(let i=0;i<p.length;i+=2){const k=key(Math.floor(p[i].x/CS),Math.floor(p[i].y/CS));let a=bgrid.get(k);if(!a)bgrid.set(k,a=[]);a.push(w,i)}}}
function bodyNear(x,y,rad,self){
  if(x*x+y*y>(AR-30)**2)return true;
  const cx=Math.floor(x/CS),cy=Math.floor(y/CS);
  for(let gx=cx-1;gx<=cx+1;gx++)for(let gy=cy-1;gy<=cy+1;gy++){const a=bgrid.get(key(gx,gy));if(!a)continue;
    for(let k=0;k<a.length;k+=2){const o=a[k];if(!o.alive||(o===self&&a[k+1]<SELF_IDX))continue;const q=o.pts[a[k+1]];if(!q)continue;const rr=rad+o.r(),dx=q.x-x,dy=q.y-y;if(dx*dx+dy*dy<rr*rr)return true}}
  return false;
}

const isHum=o=>o.isP||(o.isRemote&&!o.isBot);
function aiThink(w,f){
  const h=w.pts[0],r=w.r(),ai=w.ai;ai.t-=f;
  if(ai.t<=0){
    ai.t=rnd(D().think[0],D().think[1]);ai.hunt=null;if(D().regen)w.energy=Math.min(MAX_EN,w.energy+D().regen*ai.t/60);
    let bh=null,bd0=1500;if(w.isBoss)for(const o of worms){if(!o.alive||!isHum(o)||o.safe>0)continue;const d=Math.hypot(o.pts[0].x-h.x,o.pts[0].y-h.y);if(d<bd0){bd0=d;bh=o}}
    if(bh)ai.hunt=bh;
    else if(w.mass>22){let bd=1e9;for(const o of worms){if(o===w||!o.alive||ally(o,w))continue;const oh=o.pts[0],d=Math.hypot(oh.x-h.x,oh.y-h.y);
      const hu=isHum(o);if(!(hu&&o.safe>0)&&d<(hu?D().huntR:380)&&d<bd&&Math.random()<(hu?D().huntP:D().others)){bd=d;ai.hunt=o}}}
    if(!ai.hunt){
      let bestF=null,bs=0;const cx=Math.floor(h.x/CS),cy=Math.floor(h.y/CS);
      for(let gx=cx-4;gx<=cx+4;gx++)for(let gy=cy-4;gy<=cy+4;gy++){const a=fgrid.get(key(gx,gy));if(!a)continue;for(const fd of a){if(fd.dead)continue;const s=fd.v/(Math.hypot(fd.x-h.x,fd.y-h.y)+40);if(s>bs){bs=s;bestF=fd}}}
      if(w.energy<4)for(const wd of whites){if(wd.dead)continue;const s=6/(Math.hypot(wd.x-h.x,wd.y-h.y)+40);if(s>bs){bs=s;bestF={x:wd.x,y:wd.y,v:0}}}
      if(bestF){ai.tx=bestF.x;ai.ty=bestF.y;ai.boostT=bestF.v>1.5&&w.mass>25?40:0}
      else{[ai.tx,ai.ty]=randInWorld(500)}
    }
  }
  let tx=ai.tx,ty=ai.ty,boost=false;
  if(ai.hunt&&ai.hunt.alive){
    const o=ai.hunt,oh=o.pts[0],d=Math.hypot(oh.x-h.x,oh.y-h.y);
    if(d>(w.isBoss?1600:850))ai.hunt=null;
    else{const lead=60+o.r()*3+d*.45;tx=oh.x+Math.cos(o.angle)*lead;ty=oh.y+Math.sin(o.angle)*lead;boost=d<450&&w.mass>18}
  }else if(ai.boostT>0){ai.boostT-=f;boost=true}
  if(Math.hypot(h.x,h.y)>AR-350){tx=0;ty=0;boost=false}
  const want=Math.atan2(ty-h.y,tx-h.x);
  const lk=w.isBoss?1.3:D().look,near=(r*1.4+25)*lk,look=(r*3+65)*lk;
  const blocked=a=>bodyNear(h.x+Math.cos(a)*near,h.y+Math.sin(a)*near,r+12,w)||bodyNear(h.x+Math.cos(a)*look,h.y+Math.sin(a)*look,r+18,w);
  let pick=want;
  if(blocked(want)){
    pick=null;const side=Math.sign(Math.atan2(Math.sin(want-w.angle),Math.cos(want-w.angle)))||1;
    for(const o of[0,.6,-.6,1.2,-1.2,1.9,-1.9,2.6,-2.6]){const a=w.angle+o*side;if(!blocked(a)){pick=a;break}}
    if(pick===null)pick=w.angle+Math.PI*side;
    boost=boost||(w.mass>30&&Math.random()<.4);
  }
  w.target=pick;w.boost=boost;
}

const BOSS_COINS=500,BOSS_DMG={body:12,head:35,gold:25,bomb:50};
function bossHurt(b,dmg,by){if(!b||!b.alive||!b.isBoss)return;const h=b.pts[0];texts.push({x:h.x,y:h.y-80,txt:'👑 -'+dmg,t:1.2,c:'#ff7b7b'});b.hitFx=.35;
  if(b.isRemote){netSend({t:'bhit',id:b.netId,d:dmg});b.hp=Math.max(1,(b.hp||1)-dmg);return}
  b.hp-=dmg;if(b.hp<=0){b.hp=0;b.die(by)}}
function rammedBoss(w,b,idx){   // ผู้เล่นพุ่งชนบอส: ชนลำตัว = บอสเสียพลังนิดหน่อย, ชนหัว = เสียเยอะ · เราเด้งกลับและเสียความยาว 10%
  const head=idx<8,dmg=head?BOSS_DMG.head:BOSS_DMG.body;bossHurt(b,dmg,w);
  w.angle+=Math.PI;w.target=w.angle;if(w.isP)input.angle=w.angle;w.safe=1.5;
  const keep=Math.max(16,Math.floor(w.pts.length*.9));if(keep<w.pts.length-2)cutSelf(w,keep,true);
  const h=w.pts[0];booms.push({x:h.x,y:h.y,t:.5});
  if(w.isP){track('bossHits');shake=.35;sfx('cut');texts.push({x:h.x,y:h.y-40,txt:head?'💥 ชนหัวบอส! -'+dmg:'💥 ชนลำตัวบอส -'+dmg,t:1.6,c:'#ffd23f'})}}
// ที่เกิดใหม่: สุ่มหลายจุด เลือกจุดที่ไกลจากขบวนทุกคัน (หัว+ตัว) มากที่สุด ไม่ให้เกิดมาทับหน้าใคร
function farSpot(margin,minD,side){let best=null,bd=-1;const ts=worms.filter(w=>w.alive);
  for(let i=0;i<36;i++){let x,y;if(side!==undefined&&i<24){const a=side+rnd(-.8,.8),rr=Math.sqrt(Math.random())*Math.max(100,AR-margin);x=Math.cos(a)*rr;y=Math.sin(a)*rr}else[x,y]=randInWorld(margin);
    let d=1e9;for(const w of ts){const p=w.pts;for(let k=0;k<p.length;k+=8){const dd=Math.hypot(p[k].x-x,p[k].y-y)-(k?0:350);if(dd<d)d=dd}}
    if(d>=minD)return[x,y];if(d>bd){bd=d;best=[x,y]}}
  return best}

}

let bombing=false,bombHits=0;
function useBomb(){
  if(!player||!player.alive||player.tgs<=0||state!=='play')return;
  player.tgs--;player.bombT.shift();track('bombsUsed');const h=player.pts[0];booms.push({x:h.x,y:h.y,t:0});shake=.5;sfx('bomb');
  if(NET){netSend({t:'bomb',x:Math.round(h.x),y:Math.round(h.y)});const n=NET.host?bombBots(h.x,h.y,player):0;texts.push({x:h.x,y:h.y-60,txt:'💥 ระเบิด!'+(n?' กำจัด '+n+' ขบวน':''),t:2,c:'#ffd23f'});updBtns();return}
  bombing=true;bombHits=0;
  for(const w of worms){if(w===player||!w.alive)continue;let hit=false;for(let i=0;i<w.pts.length;i+=3){const q=w.pts[i];if((q.x-h.x)**2+(q.y-h.y)**2<BOMB_R*BOMB_R){hit=true;break}}if(hit){if(w.isBoss)bossHurt(w,BOSS_DMG.bomb,player);else w.die(player)}}
  bombing=false;track('bombKills',bombHits);trackMax('bestBomb',bombHits);
  texts.push({x:h.x,y:h.y-60,txt:'💥 ระเบิด! กำจัด '+bombHits+' ขบวน',t:2,c:'#ffd23f'});updBtns();
}
// co-op: หัวหน้าห้องคำนวณว่าระเบิดโดน AI ตัวไหน
function bombBots(x,y,by){let n=0;bombing=!!(by&&by.isP);bombHits=0;const bt=by&&(by.team||NET&&(NET.players.get(by.netId)||{}).team);
  for(const w of worms){if(!w.isBot||w.isRemote||!w.alive||bt&&w.team===bt)continue;if(w.pts.some((q,i)=>i%3===0&&(q.x-x)**2+(q.y-y)**2<BOMB_R*BOMB_R)){if(w.isBoss)bossHurt(w,BOSS_DMG.bomb,by);else{w.die(by);n++}}}
  if(bombing){track('bombKills',bombHits);trackMax('bestBomb',bombHits)}bombing=false;return n}
let lastBtn='';

  const bs=player.bombT.length?Math.ceil(player.bombT[0]):0,e=player.energy,k=e.toFixed(1)+'|'+player.tgs+'|'+player.alive+'|'+bs+'|'+(hornCD>0);if(k===lastBtn)return;lastBtn=k;

const ally=(a,b)=>!!(NET&&a.team&&a.team===b.team);
function freezeAround(src,x,y){
  let n=0;for(const o of worms){if(o===src||!o.alive)continue;if(ally(o,src))continue;const h=o.pts[0];if(Math.hypot(h.x-x,h.y-y)<FREEZE_R){o.slow=FREEZE_T;n++}}
  booms.push({x,y,t:0,ice:1});return n;

function step(f,dt){
  AR=calcAR();
  if(AR<WR&&!shrinkWarned&&state==='play'){shrinkWarned=true;announce('⚠️ วงสนามเริ่มหดแล้ว! อย่าอยู่ใกล้ขอบสีแดง')}
  buildFoodGrid();
  if(input.keyL)input.angle-=.07*f;if(input.keyR)input.angle+=.07*f;
  for(const w of worms){if(!w.alive)continue;if(w.isP){w.target=input.angle;w.boost=input.boost||input.keyB}else if(!w.isRemote)aiThink(w,f)}
  for(const w of worms){if(!w.alive)continue;if(w.isRemote)netUpdate(w,dt);else w.update(f,dt)}
  buildBodyGrid();
  // collisions
  for(const w of worms){
    if(!w.alive||w.safe>0||w.isRemote)continue;const h=w.pts[0],r=w.r(),cx=Math.floor(h.x/CS),cy=Math.floor(h.y/CS);
    let hit=null,hitIdx=0,cut=-1;
    for(let gx=cx-1;gx<=cx+1&&!hit;gx++)for(let gy=cy-1;gy<=cy+1&&!hit;gy++){const a=bgrid.get(key(gx,gy));if(!a)continue;
      for(let k=0;k<a.length;k+=2){const o=a[k],idx=a[k+1];if(!o.alive)continue;if(o===w&&(idx<SELF_IDX||w.selfCD>0))continue;if(o!==w&&(ally(o,w)||o.ghost>0))continue;
        const q=o.pts[idx];if(!q)continue;const rr=r*.7+o.r()*.9,dx=q.x-h.x,dy=q.y-h.y;
        if(dx*dx+dy*dy<rr*rr){if(o===w){if(cut<0||idx<cut)cut=idx}else{hit=o;hitIdx=idx;break}}}}
    if(hit&&w.isBoss){   // บอสพุ่งชนใคร → ขบวนนั้นขาดตรงจุดชน (บอสไม่ตาย)
      const h2=w.pts[0];w.safe=.8;booms.push({x:h2.x,y:h2.y,t:.6});
      if(NET&&hit.isRemote)netSend({t:'cut',v:hit.netId,x:Math.round(h2.x),y:Math.round(h2.y)});else cutSelf(hit,Math.max(hitIdx,8),true);
      if(hit.isP){shake=.4;texts.push({x:hit.pts[0].x,y:hit.pts[0].y-40,txt:'💥 โดนบอสชนขาด!',t:2,c:'#ff5e5e'})}}
    else if(hit&&w.gold){w.gold=false;const lost0=Math.floor(hit.mass);w.safe=1;const h2=w.pts[0];booms.push({x:h2.x,y:h2.y,t:.6});if(hit.isBoss)bossHurt(hit,BOSS_DMG.gold,w);
      if(NET&&hit.isRemote)netSend({t:'cut',v:hit.netId,x:Math.round(h2.x),y:Math.round(h2.y)});else cutSelf(hit,Math.max(hitIdx,8),true);
      if(w.isP){sfx('cut');track('golds');texts.push({x:h2.x,y:h2.y-40,txt:'{G} ชนขาด! '+hit.name+(NET?'':' สั้นลง '+(lost0-Math.floor(hit.mass))),t:2,c:'#ffd23f'})}}
    else if(hit&&hit.isBoss&&w.isP)rammedBoss(w,hit,hitIdx);
    else if(hit)w.die(hit);else if(cut>0)cutSelf(w,cut);
  }
  // eating
  for(const w of worms){
    if(!w.alive||w.isRemote||(NET&&!w.isP&&!w.isBot))continue;const h=w.pts[0],r=w.r(),mr=w.pu.magnet>0?210:0,reach=r+mr+14,mult=w.pu.x3>0?3:1;
    const x0=Math.floor((h.x-reach)/CS),x1=Math.floor((h.x+reach)/CS),y0=Math.floor((h.y-reach)/CS),y1=Math.floor((h.y+reach)/CS);
    let ate=false;
    for(let gx=x0;gx<=x1;gx++)for(let gy=y0;gy<=y1;gy++){const a=fgrid.get(key(gx,gy));if(!a)continue;
      for(const fd of a){if(fd.dead)continue;const dx=fd.x-h.x,dy=fd.y-h.y,d2=dx*dx+dy*dy,er=r+fd.r+6;
        if(d2<er*er){fd.dead=true;w.mass+=fd.v*mult*GROW;ate=true;if(NET)NET.q.eat.push(fd.id)}
        else if(mr&&d2<(r+mr)**2){const d=Math.sqrt(d2);fd.x-=dx/d*8*f;fd.y-=dy/d*8*f}}}
    if(ate&&w.isP)sfx('eat');
    for(const wd of whites){if(wd.dead)continue;if(Math.hypot(wd.x-h.x,wd.y-h.y)<r+20){wd.dead=true;w.energy=Math.min(MAX_EN,w.energy+5);
      if(NET)netSend({t:'white',id:wd.id});if(w.isP){texts.push({x:h.x,y:h.y-30,txt:'💎 +5 วิ พลังเร่ง!',t:1.4,c:'#ffffff'});sfx('white');track('whites')}}}
    if(w.isP&&goldItem&&Math.hypot(goldItem.x-h.x,goldItem.y-h.y)<r+30){w.gold=true;w.goldT=GOLD_LIFE;goldItem=null;goldTimer=rnd(60,90);sfx('gold');texts.push({x:h.x,y:h.y-40,txt:'{G} ร่างทอง! พุ่งชนศัตรูได้ 1 ครั้ง ภายใน 30 วิ',t:2.2,c:'#ffd23f'});if(NET)netSend({t:'item',k:'gold'})}
    if(w.isP&&tgsItem&&Math.hypot(tgsItem.x-h.x,tgsItem.y-h.y)<r+30){w.tgs++;w.bombT.push(BOMB_LIFE);tgsItem=null;tgsTimer=rnd(45,75);sfx('item');texts.push({x:h.x,y:h.y-40,txt:'{B} ได้ระเบิด! ต้องใช้ใน 15 วิ',t:2.2,c:'#ffd23f'});if(NET)netSend({t:'item',k:'tgs'})}
    if(!(NET&&w.isBot))for(const p of pups){if(p.dead)continue;if(Math.hypot(p.x-h.x,p.y-h.y)<r+20){p.dead=true;if(w.isP)track('pups');
      if(NET&&w.isP)netSend({t:'pu',id:p.id});
      if(p.type==='freeze'){const n=!NET||NET.host?freezeAround(w,h.x,h.y):0;if(NET){netSend({t:'frz',x:Math.round(h.x),y:Math.round(h.y)});booms.push({x:h.x,y:h.y,t:0,ice:1})}
        if(w.isP){sfx('freeze');track('freezes');texts.push({x:h.x,y:h.y-30,txt:'❄️ แช่แข็ง!'+(n?' ศัตรูช้าลง '+n+' ขบวน':''),t:1.6,c:'#9be7ff'})}}
      else{w.pu[p.type]=10;if(w.isP){sfx('item');texts.push({x:h.x,y:h.y-30,txt:PU_TYPES[p.type].icon+' '+PU_TYPES[p.type].label+'!',t:1.4,c:PU_TYPES[p.type].col})}}}}
  }
  for(const fd of foods)if(fd.ttl){fd.ttl-=dt;if(fd.ttl<=0)fd.dead=true}
  foods=foods.filter(x=>!x.dead);pups=pups.filter(x=>!x.dead);whites=whites.filter(x=>!x.dead);
  if(!NET){
    if(whites.length<WHITE_N&&Math.random()<.05)addWhite();
    if(!goldItem&&state==='play'&&!(player&&player.gold)){goldTimer-=dt;if(goldTimer<=0){const[x,y]=randInWorld(300);goldItem={x,y};announce('{G} ทองคำแท่งปรากฏแล้ว! เก็บเพื่อเป็นร่างทอง')}}
    if(!tgsItem&&state==='play'){tgsTimer-=dt;if(tgsTimer<=0){const[x,y]=randInWorld(300);tgsItem={x,y};announce('{B} ระเบิดปรากฏแล้ว! ดูตำแหน่งบนแผนที่')}}
    if(goldItem&&goldItem.x**2+goldItem.y**2>(AR-60)**2)goldItem=null;
    if(tgsItem&&tgsItem.x**2+tgsItem.y**2>(AR-60)**2)tgsItem=null;
    if(state==='play'&&!bossActive){bossTimer-=dt;if(bossTimer<=0)spawnBoss()}
    for(let i=0;i<12&&foods.length<FOOD_N;i++)addFood();
    if(pups.length<PU_N&&Math.random()<.02)addPu();
    worms=worms.filter(w=>w.alive||w.isP);
    const ai=worms.filter(w=>!w.isP&&!w.isBoss).length;if(ai<D().ai&&Math.random()<.03)spawnAI();
  }else{
    worms=worms.filter(w=>w.alive||w.isP);
    if(NET.ffa&&NET.host){
      // คนจริงเข้ามา 1 คน = บอทหายไป 1 ตัว (รวมกันไม่เกิน 30)
      const mine=worms.filter(w=>w.isBot&&!w.isRemote&&!w.isBoss&&w.alive),n=mine.length,want=Math.max(0,FFA_MAX-NET.players.size);   // คน + บอท = 30 ขบวน
      if(n<want&&(n<want-2||Math.random()<.03))spawnAI();   // เติมบอทให้ครบเกือบทันที เหลือ 2 ช่องไว้เกิดใหม่ทีละนิด
      NET.trimT=(NET.trimT||0)-dt;
      if(n>want&&NET.trimT<=0){NET.trimT=.4;const hs=worms.filter(o=>o.alive&&isHum(o));let pick=null,pd=-1;
        for(const w of mine){const h=w.pts[0];let d=1e9;for(const o of hs)d=Math.min(d,Math.hypot(o.pts[0].x-h.x,o.pts[0].y-h.y));if(d>pd){pd=d;pick=w}}
        if(pick){pick.alive=false;netSend({t:'bdie',id:pick.netId,k:null,drop:[],v:1})}}
      if(!bossActive||!bossActive.alive){bossActive=null;bossTimer-=dt;if(bossTimer<=0)spawnBoss()}}
    else if(!NET.ffa&&NET.host&&NET.phase==='play'&&state==='play')vsBots(dt);
    netTick(dt);
  }
  for(const e of booms)e.t+=dt;booms=booms.filter(e=>e.t<1.1);if(shake>0)shake-=dt;
  if(player&&player.bombT.length){for(let i=0;i<player.bombT.length;i++)player.bombT[i]-=dt;
    while(player.bombT.length&&player.bombT[0]<=0){player.bombT.shift();player.tgs=Math.max(0,player.tgs-1);if(player.alive){announce('{B} ระเบิดหมดเวลา หายไปแล้ว!');sfx('die')}}}
  if(player&&player.gold&&player.goldT!==undefined){player.goldT-=dt;if(player.goldT<=0){player.gold=false;player.goldT=undefined;if(player.alive){announce('{G} ร่างทองหมดเวลาแล้ว!');sfx('die')}}}
  if(player&&state==='play'){updBtns();checkStations(dt);if(player.alive){if(player.onRail)track('railSec',dt);trackMax('len',player.mass);trackMax('maxLen',player.mass)}}
  if(hornCD>0)hornCD-=dt;
  for(const t of texts){t.t-=dt;t.y-=30*dt}texts=texts.filter(t=>t.t>0);
  if(state==='play'&&mode==='time'){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;finish(true)}}
  if(state==='dead'){deadT-=dt;if(deadT<=0)finish(false)}
}

function carPose(p,f,b){const A=p[f],B=p[b];return{x:(A.x+B.x)/2,y:(A.y+B.y)/2,a:Math.atan2(A.y-B.y,A.x-B.x)}}
function star4(x,y,s){ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s*.3,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s*.3,y);ctx.fill();ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x,y-s*.3);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s*.3);ctx.fill()}
function glowAlong(w,col,mul,vx0,vy0,vx1,vy1,M){const p=w.pts,r=w.r();ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<p.length;i+=3){const q=p[i];if(q.x<vx0-M||q.x>vx1+M||q.y<vy0-M||q.y>vy1+M)continue;ctx.moveTo(q.x+r*mul,q.y);ctx.arc(q.x,q.y,r*mul,0,TAU)}ctx.fill()}
// ตู้รถแต่ละแบบ (ร้านค้า หมวดตู้รถ)
function drawCar(k,j,col,L,W,r,seed){
  const gem=(n,gs,sp)=>{for(let g=0;g<n;g++){const gx=(g-(n-1)/2)*L*sp,gy=(g%2?-1:1)*W*.07;ctx.drawImage(GEMS[GK[(j*5+g*3+seed)%GK.length]],gx-gs/2,gy-gs/2,gs,gs)}};
  if(k==='glass'){const ga=ctx.globalAlpha;ctx.globalAlpha=ga*.35;ctx.fillStyle=col;roundRect(-L/2,-W/2,L,W,r*.3);ctx.fill();ctx.globalAlpha=ga;
    ctx.strokeStyle=shade(col,.35);ctx.lineWidth=r*.14;ctx.stroke();gem(4,W*.5,.22);
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=r*.08;ctx.beginPath();ctx.moveTo(-L*.38,-W*.32);ctx.lineTo(-L*.1,-W*.32);ctx.stroke();return}
  ctx.fillStyle=col;roundRect(-L/2,-W/2,L,W,r*.3);ctx.fill();ctx.strokeStyle=shade(col,-.4);ctx.lineWidth=r*.12;ctx.stroke();
  if(k==='cargo'){ctx.strokeStyle=shade(col,-.25);ctx.lineWidth=r*.08;ctx.beginPath();for(const x of[-.3,-.1,.1,.3]){ctx.moveTo(L*x,-W/2+r*.15);ctx.lineTo(L*x,W/2-r*.15)}ctx.stroke();
    const bx=(x,y,s)=>{ctx.fillStyle='#c8a26a';ctx.fillRect(x-s/2,y-s/2,s,s);ctx.strokeStyle='#7a5a2a';ctx.lineWidth=r*.07;ctx.strokeRect(x-s/2,y-s/2,s,s);ctx.beginPath();ctx.moveTo(x-s/2,y-s/2);ctx.lineTo(x+s/2,y+s/2);ctx.stroke()};
    bx(-L*.18,0,W*.42);bx(L*.18,-W*.05,W*.36);return}
  if(k==='coach'){ctx.fillStyle=shade(col,.3);roundRect(-L/2+r*.18,-W*.22,L-r*.36,W*.44,r*.2);ctx.fill();
    ctx.fillStyle='rgba(255,243,176,.9)';for(const x of[-.3,-.1,.1,.3])for(const y of[-1,1])ctx.fillRect(L*x-L*.06,y*W*.36-W*.06,L*.12,W*.12);return}
  ctx.fillStyle='rgba(18,20,38,.6)';roundRect(-L/2+r*.22,-W/2+r*.22,L-r*.44,W-r*.44,r*.18);ctx.fill();gem(3,W*.52,.27)}
function drawWorm(w,vx0,vy0,vx1,vy1){
  const r=w.r(),p=w.pts,n=p.length,sk=w.gold?GOLD_SKIN:w.skin,W=r*1.75,M=3*r;
  const vis=c=>!(c.x<vx0-M||c.x>vx1+M||c.y<vy0-M||c.y>vy1+M);
  if(w.team)glowAlong(w,w.team==='A'?'rgba(255,94,94,.16)':'rgba(77,163,255,.16)',1.45,vx0,vy0,vx1,vy1,M);
  if(w.gold){const pl=.5+.5*Math.sin(frame*.15);glowAlong(w,`rgba(255,210,63,${.18+.17*pl})`,1.9,vx0,vy0,vx1,vy1,M);
    if(frame%4===0)smoke.push({x:p[(Math.random()*n)|0].x+rnd(-r,r),y:p[(Math.random()*n)|0].y+rnd(-r,r),r:3,t:.6,k:'gold'})}

function spawnTeamBot(t){const side=t==='A'?Math.PI:0,[x,y]=farSpot(300,600,side);
  const w=new Worm('🤖 '+NAMES[(Math.random()*NAMES.length)|0],SKINS[(Math.random()*SKINS.length)|0],x,y,false,{loco:LOCOS[(Math.random()*4)|0],a:side+Math.PI+rnd(-.5,.5)});
  w.mass=w.maxMass=rnd(20,45);w.team=t;w.safe=w.ghost=SPAWN_GHOST;worms.push(w);netBotReg(w)}
function vsBots(dt){const hum={A:0,B:0};for(const p of NET.players.values())if(hum[p.team]!==undefined)hum[p.team]++;
  const T=NET.vsT||(NET.vsT={A:0,B:0});
  for(const t of['A','B']){const mine=worms.filter(w=>w.isBot&&!w.isRemote&&w.alive&&w.team===t),want=Math.max(0,2-hum[t]);let n=mine.length;
    if(n>want){const w=mine[0];w.alive=false;netSend({t:'bdie',id:w.netId,k:null,drop:[],v:1})}
    else if(n<want){T[t]-=dt;if(T[t]<=0){while(n<want){spawnTeamBot(t);n++}T[t]=3}}else T[t]=3}}

function netURL(s){const proto=location.protocol==='https:'?'wss://':'ws://';if(!s)return proto+location.host+'/ws';if(/^wss?:\/\//.test(s))return s;if(/^https?:\/\//.test(s))return s.replace(/^http/,'ws').replace(/\/$/,'')+'/ws';return proto+s.replace(/\/$/,'')+'/ws'}
function netStatus(t){const e=$('netStatus');if(e)e.textContent=t}
function netConnect(room,srv,nmode){const ffa=nmode==='ffa';
  if(NET)netLeave(true);
  let ws;netStatus('กำลังเชื่อมต่อ...');
  const fail=()=>{if(ffa){NET=null;endlessFallback();return}netStatus('❌ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — โหมดออนไลน์ต้องเปิดเกมจากเซิร์ฟเวอร์ของคุณ (ลิงก์ใน Claude เชื่อมต่อภายนอกไม่ได้)');NET=null};
  try{ws=new WebSocket(netURL(srv))}catch(e){fail();return}
  NET={ws,id:null,room,ffa,bots:new Map(),bseq:0,botT:0,players:new Map(),phase:'connecting',timeLeft:300,q:{eat:[]},sendT:0,respawnT:0,score:null,host:false,opened:false};
  const me=NET;
  try{localStorage.setItem('wormName',playerName())}catch(e){}
  if(ffa)setTimeout(()=>{if(NET===me&&!me.opened){try{ws.close()}catch(e){}fail()}},7000);
  ws.onopen=()=>{me.opened=true;netSend({t:'join',room,mode:ffa?'ffa':'vs',diff:ONLINE_DIFF,name:playerName(),skin:curSkin(),...myLook(),rk:myRank()})};
  ws.onerror=()=>{if(!me.opened)fail()};
  ws.onclose=()=>{if(NET!==me)return;if(!me.opened){fail();return}NET=null;if(state==='over'){worms=worms.filter(w=>!w.isRemote&&!w.isBot);return}announce('การเชื่อมต่อหลุด กลับหน้าแรก');toMenu()};
  ws.onmessage=e=>{if(NET!==me)return;let m;try{m=JSON.parse(e.data)}catch(er){return}netMsg(m)};
}
function netLeave(silent){if(!NET)return;const n=NET;NET=null;try{n.ws.close()}catch(e){}worms=worms.filter(w=>!w.isRemote&&!w.isP&&!w.isBot);bossActive=null;$('coopBar').classList.add('hidden');if(!silent)toMenu()}

  switch(m.t){
    case'err':if(NET.ffa){const n=NET;NET=null;try{n.ws.close()}catch(e){}announce(m.msg+' — หาโลกอื่นให้แทน');netConnect('','','ffa');break}netStatus('❌ '+m.msg);break;

      NET.bots=new Map((m.bots||[]).map(b=>[b.id,b]));bossActive=null;bossTimer=D().boss;roundCoins=0;roundRP=0;
      setFoods(m.foods);whites=m.whites.map(a=>({id:a[0],x:a[1],y:a[2],ph:Math.random()*TAU,dead:false}));pups=m.pups.map(a=>({id:a[0],x:a[1],y:a[2],type:a[3],ph:Math.random()*TAU,dead:false}));
      setItems(m.items);NET.timeLeft=m.timeLeft;netPlayers(m.players);worms=[];player=null;
      if(m.phase==='play'){netSpawnMe();if(NET.ffa){player.safe=D().safe;$('sheet').classList.add('hidden');$('over').classList.add('hidden');$('coopBar').classList.remove('hidden');
        announce(NET.players.size>1?'🌍 เข้าโลก '+NET.room+' · มีผู้เล่นจริง '+NET.players.size+' คน':'🌍 โลก '+NET.room+' · กด 📤 ชวนเพื่อนเข้ามาเล่นด้วยได้')}}
      else{state='lobby';openSheet('🌐 ห้อง '+NET.room,renderLobby)}
      $('menu').classList.add('hidden');break}
    case'lobby':{const old=NET.players;netPlayers(m.players);NET.phase=m.phase;refreshSheet();
      if(NET.ffa&&state==='play'){for(const p of NET.players.values())if(!old.has(p.id)&&p.id!==NET.id)announce('🚂 '+p.name+' เข้ามาในโลกนี้แล้ว!');

      worms=[];const sp=m.spawns[NET.id];netSpawnMe(sp);$('sheet').classList.add('hidden');announce('⚔️ เริ่มแข่ง! '+TEAM_NAME[NET.me.team]+' สู้ ๆ');break}
    case's':{NET.timeLeft=m.tl;NET.score=m.sc;const seen=new Set();
      for(const a of m.p){const[id,x,y,an,ms,fl,ts,hp]=a;if(id===NET.id)continue;seen.add(id);const bi=id<0?NET.bots.get(id):null;if(id<0&&Math.floor(-id/10000)===NET.id)continue;
        const info=bi||NET.players.get(id);if(!info)continue;
        let w=worms.find(o=>o.netId===id);const alive=!!(fl&4);
        if(alive&&(!w||!w.alive)){worms=worms.filter(o=>o!==w);w=new Worm(info.name,info.skin,x,y,false,{loco:info.loco,smoke:info.smoke,wag:info.wag,kfx:info.kfx,title:info.title,a:an});w.isRemote=true;w.netId=id;if(bi){w.isBot=true;if(bi.team)w.team=bi.team;if(bi.boss){w.isBoss=true;w.maxHp=bi.mhp||100;w.hp=w.maxHp;bossActive=w}}else{w.team=info.team;w.rk=info.rk}w.mass=ms;worms.push(w)}

      if(m.k===NET.id&&player){player.kills++;sfx('kill');track('kills');const h=player.pts[0];texts.push({x:h.x,y:h.y-30,txt:'กำจัด '+((bi||NET.players.get(m.v))?.name||'')+'!',t:1.6,c:'#ffd23f'});
        if(bi&&bi.boss){addCoins(BOSS_COINS,'👑 ล้มบอสยักษ์!');track('boss')}}break}
    case'bomb':{booms.push({x:m.x,y:m.y,t:0});sfx('bomb');const by=NET.players.get(m.by);
      if(player&&player.alive&&by&&!(by.team&&by.team===player.team)&&player.safe<=0&&player.pts.some(q=>(q.x-m.x)**2+(q.y-m.y)**2<BOMB_R*BOMB_R))player.die({netId:m.by});
      if(NET.host)bombBots(m.x,m.y,{netId:m.by});break}
    case'cut':{const bw=NET.host&&m.v<0&&worms.find(o=>o.netId===m.v&&!o.isRemote&&o.alive);if(bw){let bi=8,bd=1e9;bw.pts.forEach((q,i)=>{const d=(q.x-m.x)**2+(q.y-m.y)**2;if(d<bd){bd=d;bi=i}});cutSelf(bw,Math.max(bi,8),true);break}}
      if(m.v===NET.id&&player&&player.alive){let bi=8,bd=1e9;player.pts.forEach((q,i)=>{const d=(q.x-m.x)**2+(q.y-m.y)**2;if(d<bd){bd=d;bi=i}});cutSelf(player,Math.max(bi,8),true);texts.push({x:player.pts[0].x,y:player.pts[0].y-40,txt:'💥 โดนร่างทองชนขาด!',t:2,c:'#ff5e5e'})}break;
    case'frz':{booms.push({x:m.x,y:m.y,t:0,ice:1});const by=NET.players.get(m.by);if(player&&player.alive&&by&&!(by.team&&by.team===player.team)&&Math.hypot(player.pts[0].x-m.x,player.pts[0].y-m.y)<FREEZE_R){player.slow=FREEZE_T;sfx('freeze')}
      if(NET.host)for(const w of worms)if(w.isBot&&!w.isRemote&&w.alive&&!(by&&by.team&&by.team===w.team)&&Math.hypot(w.pts[0].x-m.x,w.pts[0].y-m.y)<FREEZE_R)w.slow=FREEZE_T;break}
    case'bhit':if(NET.host){const b=worms.find(o=>o.netId===m.id&&o.isBoss&&!o.isRemote);if(b)bossHurt(b,m.d,{netId:m.by})}break;
    case'horn':{const w=worms.find(o=>o.netId===m.by&&o.alive);if(w&&player){const h=w.pts[0],d=Math.hypot(h.x-player.pts[0].x,h.y-player.pts[0].y);
      if(d<1600){hornSfx(m.k,1-d/1600);texts.push({x:h.x,y:h.y-55,txt:'📯',t:1.2,c:'#9be7ff'})}}break}
    case'left':{worms=worms.filter(o=>o.netId!==m.id);NET.players.delete(m.id);refreshSheet();break}
    case'end':netEnd(m);break;
  }
}
function setItems(it){goldItem=it.gold?{x:it.gold[0],y:it.gold[1]}:null;tgsItem=it.tgs?{x:it.tgs[0],y:it.tgs[1]}:null}
function netPlayers(list){NET.players=new Map(list.map(p=>[p.id,p]));NET.me=NET.players.get(NET.id);NET.host=!!(NET.me&&NET.me.host);
  for(const w of worms)if(w.isRemote){const p=NET.players.get(w.netId);if(p)w.team=p.team}if(player&&NET.me)player.team=NET.me.team;
  if(!NET.host&&worms.some(w=>w.isBot&&!w.isRemote)){worms=worms.filter(w=>!(w.isBot&&!w.isRemote));if(bossActive&&!bossActive.isRemote)bossActive=null}}
function renderLobby(b){
  if(!NET)return;const ps=[...NET.players.values()];
  const myT=NET.me?NET.me.team:'A';
  const col=t=>{const l=ps.filter(p=>p.team===t);return l.map(p=>`<div>${p.id===NET.id?'⭐ ':''}${p.rk!==undefined?rankIcon(p.rk)+' ':''}${String(p.name).replace(/[<>&]/g,'')}${p.host?' 👑':''}</div>`).join('')+
    Array.from({length:Math.max(0,2-l.length)},()=>'<div style="color:#8891c4">🤖 บอท (ว่าง)</div>').join('')+
    (t===myT?'<div class="tpick on">✓ คุณอยู่ทีมนี้</div>':l.length>=2?'<div class="tpick off">ทีมเต็ม</div>':`<button class="tpick" data-t="${t}">เข้าทีมนี้</button>`)};
  const canStart=NET.host&&ps.length>=1;
  b.innerHTML=`<div class="help" style="margin:0">รหัสห้อง</div><div style="font-size:30px;font-weight:600;letter-spacing:6px;color:#ffd23f">${NET.room}</div>
   <div class="help" style="margin:2px 0 6px">ส่งรหัสนี้ให้เพื่อน แล้วให้เพื่อนเปิดเว็บเกมเดียวกันและใส่รหัสห้องนี้</div>
   <div class="help" style="margin:0">เลือกทีมที่จะอยู่ (ทีมละไม่เกิน 2 คน)</div>
   <div class="teams"><div class="tcol A"><b>🔴 ทีมแดง</b>${col('A')}</div><div class="tcol B"><b>🔵 ทีมน้ำเงิน</b>${col('B')}</div></div>
   ${NET.host?`<button class="btn team" id="startBtn" ${canStart?'':'disabled'}>⚔️ เริ่มเกม (5 นาที)</button>`:'<div class="status">รอหัวหน้าห้อง 👑 กดเริ่มเกม...</div>'}
   <div class="help" style="margin:4px 0 0">ช่องที่ว่างจะเติมบอท 🤖 ระดับ Normal ให้อัตโนมัติ · เล่นคนเดียวก็เริ่มได้</div>
   <button class="btn alt" id="leaveBtn">ออกจากห้อง</button>`;
  b.querySelectorAll('button.tpick').forEach(x=>x.onclick=()=>netSend({t:'team',k:x.dataset.t}));
  const sb=b.querySelector('#startBtn');if(sb)sb.onclick=()=>netSend({t:'start'});
  b.querySelector('#leaveBtn').onclick=()=>netLeave();
}
function netSpawnMe(sp){
  let x,y,a;if(sp){[x,y,a]=sp}else{const t=NET.me&&NET.me.team;[x,y]=farSpot(600,700,t?(t==='A'?Math.PI:0):undefined);a=Math.atan2(-y,-x)+rnd(-.6,.6)}   // เกิดใหม่: ห่างจากทุกคัน หันเข้ากลางสนาม
  player=new Worm(playerName(),curSkin(),x,y,true,{...myLook(),a});player.team=NET.me?NET.me.team:null;player.netId=NET.id;player.rk=myRank();player.ghost=SPAWN_GHOST;input.angle=a;
  worms=worms.filter(w=>!w.isP);worms.push(player);cam.x=x;cam.y=y;state='play';NET.respawnT=0;
  $('snd').classList.remove('hidden');$('fsGame')&&$('fsGame').classList.remove('hidden');lastBtn='';updBtns();
}
// ---- การเคลื่อนไหวของรถไฟคนอื่นให้ลื่น: เก็บสถานะพร้อมเวลาของเครื่องผู้ส่ง แล้ววาดย้อนหลัง INTERP ms โดยเลื่อนระหว่างสองสถานะ ----
const INTERP=130;
function netSnap(w,x,y,a,m,ts){
  const now=Date.now();ts=+ts||now;const s=w.snaps||(w.snaps=[]);
  if(s.length&&ts<=s[s.length-1].t)return;                       // ซ้ำหรือมาช้ากว่าอันล่าสุด ข้าม
  const off=now-ts;w.off=w.off===undefined||off<w.off?off:w.off+(off-w.off)*.02;   // ประมาณเวลาต่างระหว่างเครื่อง (ใช้ค่าที่เร็วสุด)
  s.push({t:ts,x,y,a,m});if(s.length>30)s.shift();
}
function netUpdate(w,dt){
  const s=w.snaps;if(!s||!s.length){w.follow();return}
  const rt=Date.now()-w.off-INTERP;while(s.length>2&&s[1].t<=rt)s.shift();
  let x,y,a,m;const A=s[0],B=s[1];
  if(B&&rt>=A.t){const k=Math.min(1.25,(rt-A.t)/Math.max(1,B.t-A.t));   // เลยสถานะล่าสุดได้นิดหน่อย (เดาต่อ) ถ้าข้อมูลมาช้า
    x=A.x+(B.x-A.x)*k;y=A.y+(B.y-A.y)*k;let d=B.a-A.a;d=Math.atan2(Math.sin(d),Math.cos(d));a=A.a+d*Math.min(1,k);m=A.m+(B.m-A.m)*Math.min(1,k)}
  else{x=A.x;y=A.y;a=A.a;m=A.m}
  const h=w.pts[0],dx=x-h.x,dy=y-h.y;
  if(dx*dx+dy*dy>300*300){for(const q of w.pts){q.x+=dx;q.y+=dy}}else{h.x=x;h.y=y}   // ลอดอุโมงค์/เกิดใหม่ → ย้ายทั้งขบวน
  w.angle=a;if(m)w.mass=m;w.follow();
}
function netTick(dt){
  if(!NET)return;
  NET.timeLeft=Math.max(0,NET.timeLeft-dt);
  if(player&&!player.alive&&NET.respawnT>0){NET.respawnT-=dt;if(NET.respawnT<=0&&NET.phase==='play'){const sc=player.kills,kp=player.kPaid;netSpawnMe();player.kills=sc;player.kPaid=kp;player.safe=2.5}}
  NET.sendT-=dt;if(NET.sendT<=0&&player){NET.sendT=.05;
    const h=player.pts[0],fl=(player.boost&&player.energy>0?1:0)|(player.gold?2:0)|(player.alive?4:0)|(player.slow>0?8:0)|(player.safe>0?16:0)|(player.ghost>0?32:0);
    const o={t:'st',x:Math.round(h.x),y:Math.round(h.y),a:+player.angle.toFixed(3),m:+player.mass.toFixed(1),f:fl,ts:Date.now()};
    if(NET.q.eat.length){o.eat=NET.q.eat;NET.q.eat=[]}netSend(o)}
  if(NET.host&&(NET.ffa||NET.phase==='play')){NET.botT-=dt;if(NET.botT<=0){NET.botT=.05;const b=[];
    for(const w of worms){if(!w.isBot||w.isRemote||!w.alive)continue;const h=w.pts[0];const row=[w.netId,Math.round(h.x),Math.round(h.y),+w.angle.toFixed(2),+w.mass.toFixed(1),(w.boost&&w.energy>0?1:0)|4|(w.slow>0?8:0)|(w.safe>0?16:0)|(w.ghost>0?32:0)];if(w.isBoss)row.push(Math.ceil(w.hp));b.push(row)}
    if(b.length)netSend({t:'bs',b,ts:Date.now()})}}
}
function netEnd(m){
  NET.phase='lobby';state='lobby';const my=NET.me?NET.me.team:'A',win=m.winner===my;
  roundRP=0;if(player){addCoins(Math.floor(player.maxMass/10)+player.kills*5+(win?50:0));addRP(gameRP(player.maxMass,player.kills,win?15:-5,1));track('games');trackMax('maxLen',player.maxMass);if(win)track('teamWin');saveProf()}
  player=null;worms=[];bb.classList.add('hidden');$('bomb').classList.add('hidden');$('horn').classList.add('hidden');
  openSheet(m.winner==='draw'?'🤝 เสมอ!':win?'🏆 ทีมคุณชนะ!':'😢 ทีมคุณแพ้',b=>{
    b.innerHTML=`<div class="teams"><div class="tcol A"><b>🔴 ทีมแดง</b><div style="font-size:24px;font-weight:600">${m.A}</div></div><div class="tcol B"><b>🔵 ทีมน้ำเงิน</b><div style="font-size:24px;font-weight:600">${m.B}</div></div></div>
    ${m.players.map(p=>`<div class="item"><div class="ic" style="background:${TEAM_COL[p.team]}33">${p.id===m.mvp?'🏅':p.bot?'🤖':'🚂'}</div><div class="tx">${String(p.name).replace(/[<>&]/g,'')}<small>💀 ${p.kills} · ยาวสุด ${Math.floor(p.maxLen)}</small></div></div>`).join('')}
    <div id="coinEarn">รอบนี้ได้ +${roundCoins} 🪙${win?' (รวมโบนัสชนะ 50)':''}</div>${rankHTML(roundRP)}
    <button class="btn team" id="toLobby">กลับห้องรอ</button><button class="btn alt" id="leave2">ออกจากห้อง</button>`;
    b.querySelector('#toLobby').onclick=()=>openSheet('🌐 ห้อง '+NET.room,renderLobby);
    b.querySelector('#leave2').onclick=()=>netLeave()});
}

//  init + loop

buildWorld(WR);
for(let i=0;i<FOOD_N;i++)addFood();
for(let i=0;i<PU_N;i++)addPu();
for(let i=0;i<WHITE_N;i++)addWhite();
for(let i=0;i<D().ai;i++)spawnAI();
setSnd(SND.on);renderSkins();setDiff(diff);
let last=performance.now(),profT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-last)/1000,.05);last=t;frame++;
  step(dt*60,dt);render();
  profT+=dt;if(profT>(ACCT.mode==='acct'?20:4)){profT=0;if(profDirty)saveProf()}
}
requestAnimationFrame(loop);
{const sp=new URLSearchParams(location.search),q=sp.get('w')||sp.get('coop');if(q){const code=q.replace(/[^0-9a-z]/gi,'').slice(0,8).toUpperCase();if(code){inviteOpen=true;history.replaceState(null,'',location.pathname);openSheet('🌍 เพื่อนชวนมาเล่น',b=>renderInvite(b,code))}}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&ACCT.mode==='acct'&&(profDirty||saveT))pushProf()});
addEventListener('pagehide',()=>{if(ACCT.mode==='acct'){if(profDirty||saveT)pushProf()}else if(profDirty)saveProf()});
bootAccount();
