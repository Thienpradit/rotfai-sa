# ปลุกเว็บเกมทุก ~10 นาที ไม่ให้เซิร์ฟเวอร์แผนฟรีของ Render หลับ (หลับแล้วเปิดเกมครั้งแรกต้องรอ ~1 นาที)
# GitHub รันตามเวลาเฉพาะบน branch หลัก (main) และอาจช้ากว่ากำหนดได้บ้างช่วงคนใช้เยอะ
# ปิดได้ที่แท็บ Actions → Keep game awake → Disable workflow
name: Keep game awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 --retry 2 https://rotfai-sa-sg.onrender.com/health && echo " awake"
